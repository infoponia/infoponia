  else if(m==='rotura'){if(req('lote','Elija el lote afectado.')){const l=lot('lote'),n=cant('cant',l.disp);if(!isNaN(n))ops.push([l,-n])}}

  const delta=nota==='entre'?0:r3(sum(ops,o=>o[1])+(nuevo?nuevo.ing:0));return{e,i,m,er,ok,ops,nuevo,delta,nota,monto:Math.abs(delta)*e.precio}}

  if(e&&m==='otro')det=`<div class="fld"><span class="lbl">El ajuste<span class="req" aria-hidden="true"> *</span></span>${chips('sent',[['mas','Suma stock'],['menos','Resta stock']])}${S.att&&er.sent?`<div class="err">${er.sent}</div>`:''}</div>${fv('sent')==='mas'?altaF():fv('sent')==='menos'?`<div class="grid2">${fld('lote','Lote',{req:true,opts:lotOpts(true),err:er.lote})}${fld('cant','Cantidad a descontar',{req:true,type:'number',dec:decOf(i)>0,live:true,err:er.cant,unit:u2(i,2)})}</div>`:''}${fld('desc','Descripción',{req:true,type:'textarea',err:er.desc})}`;

VIEWS.siembra=()=>{const c=smbCalc(),{g,v}=c;

  const o={id:'OT-0'+DB.seq.ot++,tipo:'siembra',est:'a-realizar',inv:c.g.id,v:c.v.id,cant:c.cant,fecha:c.f,prio:fv('prio')||undefined,oc:c.dist.filter(d=>d.q).map(d=>[d.s.id,d.q]),res:[[c.sem.id,c.cant]].concat(c.rows.map(r=>[r.id,r.q])),creada:HOY};

INIT.transicion=()=>{S.f={};if(S.p.lote)trSel(S.p.lote)};
function trSel(id){const l=LOT(id);Object.keys(S.f).filter(k=>k.startsWith('td|')).forEach(k=>delete S.f[k]);S.f.lote=id;S.f.fecha=finEtapa(l)<HOY?HOY:finEtapa(l)}

ACT['tr-auto']=()=>{const c=trCalc();let q=c.l.act;c.dist.forEach(d=>{const n=d.el?Math.max(0,Math.min(d.lb,q)):0;S.f[d.k]=n?String(n):'';q-=n});S.dirty=true;rerender()};
function trCalc(){const l=fv('lote')&&LOT(fv('lote')),v=l&&VAR(l.v),dest=l&&sigEtapa(l),f=fv('fecha'),fe=!l?'':!f?'Ingrese la fecha de la transición.':f<HOY?'La fecha no puede ser anterior a hoy.':'';

    if(el){if(isNaN(q))err='Ingrese un número entero.';else if(q>lb)err=`Tiene ${num(lb)} agujeros libres.`}
    return{s,el,lb,k,q:el&&!isNaN(q)?q:0,err,why:s.est==='fuera'?'Fuera de servicio: no se puede elegir.':!compatible(s.id,v.perf)?`Tiene plantas de otro perfil (${perfilSector(s.id)}).`:lb<=0?'Sin agujeros libres.':''}});
  const lugar=sum(dist.filter(d=>d.el),d=>d.lb),entra=!!l&&lugar>=l.act,ubic=sum(dist,d=>d.q),de=dist.some(d=>d.err)?' ':l&&entra&&ubic!==l.act?(ubic<l.act?`Faltan ubicar ${num(l.act-ubic)} plantas.`:`Ubicaste ${num(ubic-l.act)} de más.`):'';
  return{l,v,dest,f,fe,dist,lugar,entra,ubic,de,ok:!!l&&!fe&&entra&&!de}}

    <div style="margin-top:8px">${segbar(ocup(d.s.id),comp(d.s.id),d.s.tot,E(dest).c)}</div>${d.err&&d.err.trim()?`<div class="err">${d.err}</div>`:''}${d.why?`<div class="hint">${d.why}</div>`:''}</div>`).join('')||alertBox('danger',`El invernadero no tiene sectores de ${E(dest).n}.`)}</div>${c.de&&c.de.trim()&&(S.att||c.ubic>0)?`<div class="err" style="margin-top:8px">${c.de}</div>`:''}`:'')}
  ${sec(4,'Prioridad y descripción',!!l&&!c.fe&&c.entra,`<div class="fld"><span class="lbl">Prioridad (opcional)</span>${chips('prio',[['','Sin prioridad'],['alta','Alta'],['media','Media'],['baja','Baja']])}<div class="hint">La bandeja del Capataz ordena por fecha y, a igual fecha, por prioridad. Sin prioridad cuenta como media.</div></div>${fld('desc','Descripción (opcional)',{type:'textarea'})}`)}
  </div><div class="footbar"><button class="btn btn-primary" data-act="tr-rev">Revisar resumen</button><button class="btn btn-ghost" data-act="cancel" data-v="prod">Cancelar</button></div></div>

/* ---- Registrar merma (Agrónomo y Capataz) ---- */
const DESC='Descarte por selección';
/* Aplica una merma a un lote: saca plantas de los sectores, descuenta costo al promedio y suma a merma o a descarte. */
function aplicarMerma(l,porSector,causa,nota){const n=sum(porSector,x=>x[1]),cp=costoPlanta(l),monto=Math.round(n*cp*100)/100;
  porSector.forEach(([sid,q])=>{const o=l.oc.find(x=>x[0]===sid);if(o)o[1]-=q});l.oc=l.oc.filter(o=>o[1]>0);l.act-=n;l.saldo=Math.round((l.saldo-monto)*100)/100;if(causa===DESC)l.descarte+=n;else l.merma+=n;
  DB.bit.unshift({u:USERS[S.role].n,f:HOY,h:'10:00',inv:l.inv,t:'Merma',lote:l.id,sec:porSector.map(x=>SEC(x[0]).n),d:`${pl(n,'planta')}${nota||''}. Causa: ${causa.toLowerCase()}.`});return{n,monto}}
function mermaInfo(l,n,causa){const cp=costoPlanta(l),pct=causa===DESC?mermaPct(l):(l.merma+n)/l.ini*100,sup=causa!==DESC&&pct>DB.cfg.porcMerma,tp=transPend(l),a=[];
  if(sup)a.push(alertBox('warn',`<b>La merma del lote pasa a ${pct.toFixed(1).replace('.',',')} %</b> y el tolerado es ${DB.cfg.porcMerma} %. Se genera una alerta para el Agrónomo y el Gerente.`));
  if(causa===DESC)a.push(alertBox('info','El descarte por selección no cuenta para el umbral de merma: es una decisión de calidad, no una pérdida. Sí descuenta plantas y costo.'));
  if(tp&&l.act-n<tp.cant&&S.view==='merma')a.push(alertBox('warn',`El lote queda con menos plantas que las de la transición planificada ${tp.id} (${num(tp.cant)}). Se avisa al Agrónomo.`));
  if(l.act-n===0)a.push(alertBox('warn','El lote se queda sin plantas y pasa a finalizado.'));return{cp,monto:n*cp,pct,sup,html:a.join('')}}
/* =========================================================

INIT['c-siembra']=()=>{S.f={fecha:HOY};ORD(S.p.id).oc.forEach(([sid,n])=>S.f['cs|'+sid]=String(n))};
function csCalc(){const o=ORD(S.p.id),g=INV(o.inv),v=VAR(o.v);let bad=false,ibad=false;
  const secs=o.oc.map(([sid,n])=>{const k='cs|'+sid,q=fnum(k),err=isNaN(q)?'Ingrese un número entero, 0 o más.':q>n?`La orden reservó ${num(n)} agujeros en este sector.`:'';if(err)bad=true;return{s:SEC(sid),n,k,q:err?0:q,err}});
  const tot=sum(secs,s=>s.q),te=!bad&&!tot?'Si no se sembró nada, solicite al Agrónomo que cancele la orden.':'',f=fv('fecha'),fe=!f?'Ingrese la fecha en que se sembró.':f>HOY?'La fecha no puede ser posterior a hoy.':f<o.creada?`La orden se creó el ${fmt(o.creada)}.`:'';
  const ins=o.res.map(([id,res])=>{const i=INS(id),e=EX(id,o.inv),sem=i.v===o.v,dc=decOf(i),ku='cu|'+id,kd='cd|'+id,u=qparse(fv(ku,sem?tot:res),dc),tope=isNaN(u)?0:r3(Math.max(0,res-u)),d=qparse(fv(kd,tope),dc);let ue='',de='';
    if(isNaN(u))ue=qMsg(dc,true);
    if(isNaN(d))de=qMsg(dc,true);else if(!ue&&d>tope)de=`Como máximo ${num(tope)}: lo reservado menos lo utilizado.`;
    const cons=ue||de?0:r3(Math.max(res,u)-d),R=!ue&&!de&&i.venc&&cons?reparto('cr|'+id,e,cons,f&&!fe?f:HOY):null;if(ue||de||(R&&R.err))ibad=true;
    return{id,i,e,sem,res,ku,kd,ud:sem?tot:res,dd:tope,u,d,ue,de,cons,R,monto:cons*e.precio}});
  return{o,g,v,secs,tot,te,f,fe,ok0:!bad&&!te&&!fe,ins,ok1:!ibad,costo:sum(ins,x=>x.monto)}}

  const nav=(next,label)=>`<div class="footbar">${S.step?`<button class="btn btn-ghost" style="min-height:48px" data-act="step" data-d="-1">${ic('back',14)} Atrás</button>`:''}<button class="btn btn-primary" style="flex:1;min-height:48px;justify-content:center" data-act="${next}">${label}</button></div>`;
  if(S.step===0)return `<div class="page">${head}${pasos(0,'Plantines sembrados')}<div class="card" style="padding:14px;margin-bottom:12px">${fld('fecha','Fecha en que se sembró',{req:true,type:'date',live:true,err:c.fe,hint:c.fe?'':`Entre el ${fmt(o.creada)} (creación de la orden) y hoy. Programada para el ${fmt(o.fecha)}.`})}</div><div class="stack tight">${c.secs.map(s=>`<div class="card" style="padding:14px"><div class="row" style="margin-bottom:8px"><b>Sector ${esc(s.s.n)}</b><span class="spacer"></span><span class="muted sm">Planificados: ${num(s.n)}</span></div>${stepper(s.k,s.n,'Plantines sembrados en '+s.s.n)}${s.err?`<div class="err">${s.err}</div>`:''}</div>`).join('')}</div>
    <div class="row" style="margin-top:12px"><span>Total sembrado</span><span class="spacer"></span><b class="mono" style="font-size:18px">${num(c.tot)}</b></div>${c.te?`<div class="err">${c.te}</div>`:''}
    ${c.ok0&&c.tot<o.cant?`<div style="margin-top:10px">${alertBox('info',`Son ${num(o.cant-c.tot)} menos que lo planificado. Los agujeros que no se usaron quedan libres.`)}</div><div class="card" style="padding:14px;margin-top:10px">${fld('motivo','Motivo de la diferencia (opcional)',{type:'textarea',ph:'Ej. Faltaron cubos de espuma'})}</div>`:''}${nav('cs-next','Siguiente')}</div>`;
  if(S.step===1)return `<div class="page">${head}${pasos(1,'Insumos utilizados')}<div class="stack tight">${c.ins.map(x=>`<div class="card" style="padding:14px"><div class="row" style="margin-bottom:10px"><b>${esc(x.i.n)}</b><span class="spacer"></span><span class="muted sm">Reservado: ${num(x.res)}</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="lbl" for="f-${x.ku}">Utilizado</label><input class="field-input num" style="min-height:44px;max-width:none" type="text" inputmode="numeric" id="f-${x.ku}" data-f="${x.ku}" data-live value="${esc(fv(x.ku,x.ud))}" autocomplete="off"></div><div><label class="lbl" for="f-${x.kd}">Vuelve al depósito</label><input class="field-input num" style="min-height:44px;max-width:none" type="text" inputmode="numeric" id="f-${x.kd}" data-f="${x.kd}" data-live value="${esc(fv(x.kd,x.dd))}" autocomplete="off"></div></div>
    ${x.ue?`<div class="err">${x.ue}</div>`:''}${x.de?`<div class="err">${x.de}</div>`:''}${!x.ue&&!x.de?`<div class="hint">Sale del stock: <b class="mono">${num(x.cons)}</b> ${u2(x.i,x.cons)}${x.cons>x.u?`. ${num(x.cons-x.u)} no se usaron ni volvieron: se cuentan como dañados o perdidos.`:'.'}</div>`:''}
    ${x.R?repartoHtml('cr|'+x.id,x.e,x.cons,HOY):''}</div>`).join('')}</div>${nav('cs-next','Revisar')}</div>`;
  return `<div class="page">${head}${pasos(2,'Resumen')}<div class="card" style="padding:16px"><dl class="dl" style="grid-template-columns:120px 1fr"><dt>Lote nuevo</dt><dd><b>${vn(v)}</b> · ${pl(c.tot,'planta')}</dd><dt>En Germinación</dt><dd>${c.secs.filter(s=>s.q).map(s=>`${s.s.n} (${s.q})`).join(', ')}</dd><dt>Fecha de siembra</dt><dd>${fmt(c.f)}</dd>${c.tot<o.cant?`<dt>Diferencia</dt><dd>${num(o.cant-c.tot)} menos que lo planificado${fv('motivo')?' · '+esc(fv('motivo')):''}</dd>`:''}<dt>Cosecha estimada</dt><dd>${fmt(addD(c.f,hastaMad(v)))}</dd>
    <dt>Sale del stock</dt><dd>${c.ins.map(x=>`${esc(x.i.n)}: ${num(x.cons)}${x.R?' ('+Object.entries(x.R.r).filter(y=>y[1]).map(y=>y[0]).join(', ')+')':''}`).join('<br>')}</dd></dl></div>${nav('cs-ok','Confirmar siembra')}</div>`};
ACT['cs-next']=()=>{const c=csCalc();if(S.step===0?!c.ok0:!c.ok1){S.att=true;rerender();return}S.att=false;S.step++;rerender();document.querySelector('main.main').scrollTop=0};
ACT['cs-ok']=()=>{const c=csCalc(),o=c.o,id='L-'+DB.seq.l++,items=[`Lote ${id}: ${pl(c.tot,'planta')} de ${vn(c.v)} en Germinación.`];
  c.ins.forEach(x=>{if(x.cons){aplicarReparto(x.e,x.R?x.R.r:fefo(x.e,x.cons,c.f),x.cons);items.push(`${esc(x.i.n)}: salieron ${num(x.cons)} del stock${x.d?' y volvieron '+num(x.d)+' al depósito':''}.`)}});
  DB.lotes.push({id,inv:o.inv,v:o.v,et:'ger',ini:c.tot,act:c.tot,oc:c.secs.filter(s=>s.q).map(s=>[s.s.id,s.q]),siembra:c.f,entrada:c.f,saldo:c.costo,merma:0,descarte:0});
  const plan=o.cant,dif=plan-c.tot,exc=c.ins.filter(x=>x.u>x.res);Object.assign(o,{est:'concretada',lote:id,cant:c.tot,fecha:c.f,oc:[],res:[]});
  notify(c.g.agr,`Siembra concretada: ${o.id}`,`Martín Gómez sembró ${pl(c.tot,'plantín','plantines')} de ${vn(c.v)} (lote ${id}) el ${fmt(c.f)}.${dif?` Son ${num(dif)} menos que lo planificado${fv('motivo')?': '+fv('motivo'):''}.`:' Lo mismo que lo planificado.'}${exc.length?' Insumos por encima de lo reservado: '+exc.map(x=>`${x.i.n} (reservado ${num(x.res)}, utilizado ${num(x.u)})`).join('; ')+'.':''}`);items.push('Se notificó al Agrónomo.');if(c.tot<c.secs.reduce((n,s)=>n+s.n,0))items.push('Los agujeros reservados que no se usaron quedaron libres.');
  DB.bit.unshift({u:USERS[S.role].n,f:c.f,h:'10:00',inv:o.inv,t:'Siembra',lote:id,sec:c.secs.filter(s=>s.q).map(s=>s.s.n),d:`${pl(c.tot,'plantín','plantines')} de ${vn(c.v)} en ${lista(c.secs.filter(s=>s.q).map(s=>s.s.n))} (${o.id}).`});S.ok={lote:id,items};S.dirty=false;rerender();document.querySelector('main.main').scrollTop=0};

/* ---- Concretar transición de etapa ---- */
/* Propuesta: las plantas del lote se reparten en proporción a lo planificado en cada sector, con el método del resto mayor.
   Empate: el sector con más agujeros planificados y, si sigue, el primero de la lista. */
function propTrans(o,n){const tot=sum(o.oc,x=>x[1]);if(n>=tot)return o.oc.map(x=>x[1]);const base=o.oc.map(x=>Math.floor(n*x[1]/tot)),rest=o.oc.map((x,i)=>({i,r:n*x[1]/tot-base[i],q:x[1]})).sort((a,b)=>b.r-a.r||b.q-a.q||a.i-b.i);let f=n-sum(base);rest.forEach(x=>{if(f>0){base[x.i]++;f--}});return base}
/* Fecha mínima del traslado: la mayor entre la entrada del lote a su etapa y su último registro de bitácora en ella. */
const fMinTrans=l=>DB.bit.filter(b=>b.lote===l.id&&b.f>=l.entrada).map(b=>b.f).concat([l.entrada]).sort().pop();
INIT['c-trans']=()=>{S.f={fecha:HOY};const o=ORD(S.p.id),q=propTrans(o,LOT(o.lote).act);o.oc.forEach(([sid],i)=>S.f['ct|'+sid]=String(q[i]))};
function ctCalc(){const o=ORD(S.p.id),l=LOT(o.lote),v=VAR(o.v);let bad=false;
  const secs=o.oc.map(([sid,n])=>{const k='ct|'+sid,q=fnum(k),err=isNaN(q)?'Ingrese un número entero, 0 o más.':q>n?`La orden reservó ${num(n)} agujeros en este sector.`:'';if(err)bad=true;return{s:SEC(sid),n,k,q:err?0:q,err}});
  const tot=sum(secs,s=>s.q),te=bad?'':!tot?'Si no se trasladó ninguna planta, solicite al Agrónomo que cancele la orden.':tot>l.act?`El lote tiene ${num(l.act)} plantas.`:'',falt=te||bad?0:l.act-tot,causa=fv('causa'),ce=falt&&!causa?'Elija qué pasó con las plantas que no se trasladaron.':'',de=falt&&causa==='Otra'&&!String(fv('desc')).trim()?'Cuente qué pasó.':'',f=fv('fecha'),fm=fMinTrans(l),fe=!f?'Ingrese la fecha del traslado.':f>HOY?'La fecha no puede ser posterior a hoy.':f<fm?(fm===l.entrada?`El lote entró a ${E(l.et).n} el ${fmt(l.entrada)}.`:`El lote tiene un registro en la bitácora del ${fmt(fm)}: el traslado no puede ser anterior.`):'';
  return{o,l,v,secs,tot,te,falt,causa,ce,de,f,fe,fm,ok0:!bad&&!te&&!ce&&!de&&!fe}}
VIEWS['c-trans']=()=>{const c=ctCalc(),{o,l,v}=c;
  if(S.ok)return `<div class="page">${alertBox('ok',`<b>Transición concretada</b><div>${l.id} ya está en ${E(l.et).n}.</div>`)}<div class="card" style="margin-top:14px"><div class="card-title">Qué se registró</div><ul style="margin-left:18px;display:grid;gap:6px">${S.ok.items.map(x=>'<li>'+x+'</li>').join('')}</ul></div><button class="btn btn-primary" style="width:100%;min-height:48px;margin-top:16px;justify-content:center" data-act="go" data-v="bandeja">Volver a mis órdenes</button></div>`;
  const head=`<button class="btn btn-ghost btn-sm" style="margin-bottom:12px" data-act="cancel" data-v="bandeja">${ic('back',14)} Mis órdenes</button><div class="page-h" style="margin-bottom:12px"><h1>Concretar transición</h1><div class="sub" style="margin-top:0">${o.id} · ${l.id} · ${vn(v)} · ${pl(l.act,'planta')}</div></div><div class="row" style="gap:6px;margin-bottom:12px">${et(l.et)}${ic('right',13)}${et(o.dest)}</div>`;
  if(S.step===0)return `<div class="page">${head}<div class="card" style="padding:14px;margin-bottom:12px">${fld('fecha','Fecha del traslado',{req:true,type:'date',live:true,err:c.fe,hint:c.fe?'':`Entre el ${fmt(c.fm)} (${c.fm===l.entrada?'entrada a '+E(l.et).n:'último registro del lote en la bitácora'}) y hoy.`})}</div><div class="stack tight">${c.secs.map(s=>`<div class="card" style="padding:14px"><div class="row" style="margin-bottom:8px"><b>Sector ${esc(s.s.n)}</b><span class="spacer"></span><span class="muted sm">Reservados: ${num(s.n)}</span></div>${stepper(s.k,s.n,'Plantas ubicadas en '+s.s.n)}${s.err?`<div class="err">${s.err}</div>`:''}</div>`).join('')}</div>
    <div class="row" style="margin-top:12px"><span>Plantas trasladadas</span><span class="spacer"></span><b class="mono" style="font-size:18px">${num(c.tot)} de ${num(l.act)}</b></div>${c.te?`<div class="err">${c.te}</div>`:''}
    ${c.falt?`<div class="card" style="padding:14px;margin-top:12px;border-color:var(--status-warn)"><b>${pl(c.falt,'planta no se trasladó','plantas no se trasladaron')}. ¿Qué pasó?</b><div style="margin-top:10px">${chips('causa',CAUSAS,false,true)}</div>${S.att&&c.ce?`<div class="err">${c.ce}</div>`:''}${c.causa===DESC?'<div class="hint">Elija esta causa cuando se dejaron afuera, a propósito, las plantas más débiles. No cuenta para el umbral de merma.</div>':''}<div style="margin-top:12px">${fld('desc',c.causa==='Otra'?'Descripción':'Descripción (opcional)',{type:'textarea',req:c.causa==='Otra',err:c.de})}</div></div>`:''}
    <div class="footbar"><button class="btn btn-primary" style="flex:1;min-height:48px;justify-content:center" data-act="ct-next">Revisar</button></div></div>`;
  const inf=c.falt?mermaInfo(l,c.falt,c.causa):null;
  return `<div class="page">${head}<div class="card" style="padding:16px"><div class="card-title">Resumen</div><dl class="dl" style="grid-template-columns:120px 1fr"><dt>Pasan a ${E(o.dest).n}</dt><dd>${pl(c.tot,'planta')}: ${c.secs.filter(s=>s.q).map(s=>`${s.s.n} (${s.q})`).join(', ')}</dd><dt>Se liberan</dt><dd>${l.oc.map(x=>`${SEC(x[0]).n} (${x[1]})`).join(', ')}</dd>
    ${c.falt?`<dt>Merma</dt><dd>${pl(c.falt,'planta')} · ${c.causa.toLowerCase()}</dd>`:''}<dt>Fecha del traslado</dt><dd>${fmt(c.f)}</dd></dl></div>${inf&&inf.html?`<div class="stack tight" style="margin-top:12px">${inf.html}</div>`:''}
    <div class="footbar"><button class="btn btn-ghost" style="min-height:48px" data-act="step" data-d="-1">${ic('back',14)} Atrás</button><button class="btn btn-primary" style="flex:1;min-height:48px;justify-content:center" data-act="ct-ok">Confirmar transición</button></div></div>`};
ACT['ct-next']=()=>{if(!ctCalc().ok0){S.att=true;rerender();return}S.att=false;S.step=1;rerender();document.querySelector('main.main').scrollTop=0};
ACT['ct-ok']=()=>{const c=ctCalc(),{o,l}=c,de=E(l.et).n,libera=lista(l.oc.map(x=>SEC(x[0]).n)),items=[];
  if(c.falt){const inf=mermaInfo(l,c.falt,c.causa),monto=Math.round(inf.monto*100)/100;l.saldo=Math.round((l.saldo-monto)*100)/100;if(c.causa===DESC)l.descarte+=c.falt;else l.merma+=c.falt;alertasMerma(l,false);
    DB.bit.unshift({u:USERS[S.role].n,f:c.f,h:'10:00',inv:l.inv,t:'Merma',lote:l.id,sec:[],d:`${pl(c.falt,'planta')} sin trasladar. Causa: ${c.causa.toLowerCase()}.`});items.push(`Merma de ${pl(c.falt,'planta')} (${c.causa.toLowerCase()}).`);if(inf.sup)items.push('Alerta de umbral de merma para el Agrónomo y el Gerente.')}
  Object.assign(l,{et:o.dest,entrada:c.f,act:c.tot,oc:c.secs.filter(s=>s.q).map(s=>[s.s.id,s.q])});Object.assign(o,{est:'concretada',cant:c.tot,fecha:c.f,oc:[]});
  items.unshift(`${l.id}: ${pl(c.tot,'planta')} de ${de} a ${E(o.dest).n}, en ${lista(l.oc.map(x=>SEC(x[0]).n))}.`,`Se liberaron los agujeros de ${libera}.`);
  notify(INV(l.inv).agr,`Transición concretada: ${o.id}`,`${l.id} pasó a ${E(o.dest).n} el ${fmt(c.f)} con ${pl(c.tot,'planta')}${c.falt?`; ${num(c.falt)} no se trasladaron (${c.causa.toLowerCase()})`:''}.${c.f<o.creada?` La fecha del traslado es anterior a la creación de la orden (${fmt(o.creada)}).`:''}`);items.push('Se notificó al Agrónomo.');
  DB.bit.unshift({u:USERS[S.role].n,f:c.f,h:'10:00',inv:l.inv,t:'Transición',lote:l.id,sec:l.oc.map(x=>SEC(x[0]).n),d:`${pl(c.tot,'planta')} a ${E(o.dest).n}, en ${lista(l.oc.map(x=>SEC(x[0]).n))} (${o.id}).`});S.ok={items};S.dirty=false;rerender();document.querySelector('main.main').scrollTop=0};

/* =========================================================
   Registrar en bitácora (Agrónomo y Capataz): elegir el tipo de registro,
   registrar merma (de un lote o de una partida de cámara) y registrar otro evento.
   Las siembras, transiciones, cosechas y reubicaciones se registran solas al concretar cada operación.
   ========================================================= */
/* A dónde vuelve cada pantalla: el Capataz a su bandeja; el Agrónomo, a la ficha del invernadero o al selector. */
const bitHome=()=>S.role==='cap'?['bandeja','Mis órdenes',{}]:S.p.from==='reg'?['bit-reg','Volver',{inv:S.p.inv||''}]:S.p.inv?['inv',esc(INV(S.p.inv).n),{id:S.p.inv}]:['prod','Producción',{}];
const bitBack=()=>{const[v,t,d]=bitHome();return backBtn(v,Object.entries(d).map(([k,x])=>`data-${k}="${x}"`).join(' '),t)};
const bitCancel=()=>{const[v,,d]=bitHome();return `data-act="cancel" data-v="${v}" ${Object.entries(d).map(([k,x])=>`data-${k}="${x}"`).join(' ')}`};
const bitGo=()=>{const[v,,d]=bitHome();return `data-act="go" data-v="${v}" ${Object.entries(d).map(([k,x])=>`data-${k}="${x}"`).join(' ')}`};

/* ---- Selector de tipo ---- */
INIT['bit-reg']=()=>{S.f={inv:S.role==='cap'?mine()[0].id:(S.p.inv||'')}};
VIEWS['bit-reg']=()=>{const cap=S.role==='cap',g=fv('inv')&&INV(fv('inv'));
  const opt=(v,icon,t,d)=>`<button class="opt" ${g?`data-act="go" data-v="${v}" data-inv="${g.id}" data-from="reg"`:'aria-disabled="true"'}><span class="ico">${ic(icon,20)}</span><span class="t"><b>${t}</b><span>${d}</span></span>${ic('right',16)}</button>`;
  return `<div class="page narrow">${cap?backBtn('bandeja','','Mis órdenes'):g&&S.p.inv?backBtn('inv',`data-id="${g.id}"`,esc(g.n)):backBtn('prod','','Producción')}<div class="page-h"><h1>Registrar en bitácora</h1><div class="sub">Elija qué va a registrar.</div></div>
  ${cap?'':`<div class="card" style="margin-bottom:16px">${S.p.inv?`<div class="fld" style="margin:0"><span class="lbl">Invernadero</span><b class="lockedval">${esc(g.n)}</b></div>`:fld('inv','Invernadero',{req:true,opts:mine().map(x=>[x.id,x.n])})}</div>`}
  <div class="bigopt">${opt('merma','warn','Merma','Plantas de un lote en pie, o producto guardado en la cámara, que se perdió o se descartó.')}${opt('aplic','drop','Aplicación de insumos','Productos de limpieza o nutrientes usados sin una orden de trabajo.')}${opt('evento','clock','Otro evento','Un hecho que conviene dejar registrado y que no es de los tipos anteriores. Por ejemplo, un corte de energía.')}</div>
  <p class="hint" style="margin-top:16px">Las siembras, las transiciones y las cosechas se registran solas al concretar cada orden.${cap?'':' La salida de servicio de un sector se registra desde la tarjeta del sector, en la pestaña Sectores.'}</p></div>`};

/* ---- Registrar merma: un lote o una partida por registro; tres pasos ---- */
INIT.merma=()=>{S.f={tipo:S.p.part?'cam':S.p.lote?'lote':'',lote:S.p.lote||'',part:S.p.part||''};if(!S.p.inv)S.p.inv=S.p.lote?LOT(S.p.lote).inv:S.p.part?PART(S.p.part).inv:'';S.dirty=false};
ACT.mtipo=()=>{['lote','part','causa','desc','mcant'].forEach(k=>delete S.f[k]);Object.keys(S.f).filter(k=>k.startsWith('mq|')).forEach(k=>delete S.f[k])};
ACT.msel=()=>{Object.keys(S.f).filter(k=>k.startsWith('mq|')).forEach(k=>delete S.f[k]);delete S.f.mcant};
function mrCalc(){const fijo=!!(S.p.lote||S.p.part),ids=(S.p.inv?[S.p.inv]:mine().map(g=>g.id)),t=fv('tipo'),causa=fv('causa');
  const lotes=DB.lotes.filter(x=>ids.includes(x.inv)&&x.act>0),parts=DB.camara.filter(x=>ids.includes(x.inv)&&estPart(x)==='disponible');
  const l=t==='lote'&&fv('lote')?LOT(fv('lote')):null,p=t==='cam'&&fv('part')?PART(fv('part')):null,ok0=!!(l||p);let bad=false,rows=[],tot=0,qe='';
  if(l){rows=l.oc.map(([sid,n])=>{const k='mq|'+sid,r=String(fv(k)).trim(),q=r===''?0:fnum(k);let err='';if(isNaN(q))err='Ingrese un número entero.';else if(q>n)err=`En el sector hay ${num(n)} plantas del lote.`;if(err)bad=true;return{s:SEC(sid),n,k,q:err?0:q,err}});tot=sum(rows,r=>r.q)}
  if(p){const r=String(fv('mcant')).trim(),q=fnum('mcant');if(r==='')qe='Ingrese cuántas plantas se perdieron.';else if(isNaN(q)||q<1)qe='Ingrese un número entero mayor que 0.';else if(q>p.disp)qe=`La partida tiene ${num(p.disp)} plantas disponibles.`;else tot=q}
  const te=l&&!bad&&!tot?'Ingrese cuántas plantas se perdieron, en al menos un sector.':'',ce=!causa?'Elija la causa.':'',de=causa==='Otra'&&!String(fv('desc')).trim()?'Cuente qué pasó.':'';
  return{fijo,t,lotes,parts,l,p,ok0,rows,tot,qe,te,ce,de,causa,ok1:ok0&&!bad&&!te&&!(p&&qe)&&!ce&&!de}}
const mrHead=()=>`<div class="page-h"><h1>Registrar merma</h1><div class="sub">Se registra con la fecha y la hora actuales. Si la pérdida se detectó antes, indíquelo en la descripción.</div></div>`;
VIEWS.merma=()=>{const c=mrCalc(),{l,p}=c,cap=S.role==='cap';
  if(S.ok)return `<div class="page narrow">${alertBox('ok',`<b>Merma registrada</b><div>${S.ok.t}</div>`)}<div class="card" style="margin-top:16px"><div class="card-title">Qué se registró</div><ul style="margin-left:18px;display:grid;gap:6px">${S.ok.items.map(x=>'<li>'+x+'</li>').join('')}</ul></div><div class="row" style="margin-top:18px"><button class="btn btn-primary" style="min-height:46px" ${bitGo()}>Volver</button>${c.fijo?'':`<button class="btn btn-ghost" style="min-height:46px" data-act="go" data-v="merma" data-inv="${S.p.inv||''}" data-from="${S.p.from||''}">Registrar otra</button>`}</div></div>`;
  const nav=(next,label)=>`<div class="footbar">${S.step?`<button class="btn btn-ghost" style="min-height:48px" data-act="step" data-d="-1">${ic('back',14)} Atrás</button>`:`<button class="btn btn-ghost" style="min-height:48px" ${bitCancel()}>Cancelar</button>`}<button class="btn btn-primary" style="flex:1;min-height:48px;justify-content:center" data-act="${next}">${label}</button></div>`;
  const quien=l?`<b class="mono">${l.id}</b> · ${vn(VAR(l.v))} · ${INV(l.inv).n}`:p?`Partida <b class="mono">${p.id}</b> · ${vn(VAR(p.v))} · cámara de ${INV(p.inv).n}`:'';
  /* Paso 1: qué se perdió */
  if(S.step===0){let body;
    if(c.fijo)body=`<div class="fld" style="margin:0"><span class="lbl">${l?'Lote':'Partida de cámara'}</span><span class="lockedval" style="display:block">${quien}</span><div class="hint">${l?'Viene del lote elegido: no se cambia.':'Viene de la partida elegida: no se cambia.'}</div></div>`;
    else body=`<div class="fld"><span class="lbl">Dónde ocurrió<span class="req" aria-hidden="true"> *</span></span><div class="chips" role="group">${[['lote','Lote en pie'],['cam','Producto en cámara']].map(([a,b])=>`<button type="button" class="chip" data-act="set" data-k="tipo" data-v="${a}" aria-pressed="${c.t===a}" data-then="mtipo">${b}</button>`).join('')}</div>${S.att&&!c.t?'<div class="err">Elija si la merma es de un lote o de la cámara.</div>':''}</div>
      ${c.t==='lote'?fld('lote','Lote',{req:true,then:'msel',opts:c.lotes.map(x=>[x.id,`${x.id} · ${vn(VAR(x.v))} · ${E(x.et).n} · ${INV(x.inv).n}`]),err:reqErr('lote','Elija el lote.'),hint:'Un lote por registro. Si se perdieron plantas de otro lote, regístrelo después.'}):''}
      ${c.t==='cam'?(c.parts.length?fld('part','Partida',{req:true,then:'msel',opts:c.parts.map(x=>[x.id,`${x.id} · ${vn(VAR(x.v))} · ${num(x.disp)} disponibles · ${INV(x.inv).n}`]),err:reqErr('part','Elija la partida.'),hint:'Una partida por registro.'}):alertBox('info','No hay partidas disponibles en la cámara.')):''}`;
    return `<div class="page narrow">${bitBack()}${mrHead()}${pasos(0,'Qué se perdió')}<div class="card">${body}</div>
      ${l?`<div class="row sm" style="gap:14px;margin-top:12px">${et(l.et)}<span><b class="mono">${num(l.act)}</b> plantas</span><span>Merma <b class="mono">${mermaPct(l).toFixed(1).replace('.',',')} %</b> de ${DB.cfg.porcMerma} %</span></div>`:p?`<div class="row sm" style="gap:14px;margin-top:12px"><span><b class="mono">${num(p.disp)}</b> disponibles${p.res?` · ${num(p.res)} reservadas`:''}</span><span>Lote de origen ${p.lote}</span><span>Apta hasta el ${fmt(p.fl)}</span></div>`:''}${nav('mr-next','Siguiente')}</div>`}
  /* Paso 2: cantidades y causa */
  const causas=l?CAUSAS:CAUSAS_CAM;
  if(S.step===1)return `<div class="page narrow">${bitBack()}${mrHead()}${pasos(1,'Cantidades y causa')}<p class="sm" style="margin-bottom:10px">${quien}</p>
    <div class="card">${l?`<div class="card-title">Plantas perdidas por sector</div><div class="stack tight">${c.rows.map(r=>`<div class="blk"><div class="row" style="margin-bottom:8px"><b>${esc(r.s.n)}</b><span class="spacer"></span><span class="muted sm">${num(r.n)} plantas del lote</span></div>${stepper(r.k,r.n,'Plantas perdidas en '+r.s.n)}${r.err?`<div class="err">${r.err}</div>`:''}</div>`).join('')}</div>${S.att&&c.te?`<div class="err">${c.te}</div>`:''}<div class="row" style="margin-top:12px"><span>Total</span><span class="spacer"></span><b class="mono" style="font-size:18px">${num(c.tot)}</b></div>`
      :fld('mcant','Plantas perdidas',{req:true,type:'number',live:true,err:c.qe,unit:'plantas',hint:`Disponibles en la partida: ${num(p.disp)}.${p.res?` ${num(p.res)} están reservadas para pedidos.`:''}`})}</div>
    <div class="card" style="margin-top:12px"><div class="fld"><span class="lbl">Causa<span class="req" aria-hidden="true"> *</span></span>${chips('causa',causas,false,true)}${S.att&&c.ce?`<div class="err">${c.ce}</div>`:''}${c.causa===DESC?'<div class="hint">El descarte por selección no cuenta para el umbral de merma.</div>':''}${p?'<div class="hint">El vencimiento de una partida lo registra InfoPonia solo.</div>':''}</div>${fld('desc',c.causa==='Otra'?'Descripción':'Descripción (opcional)',{type:'textarea',req:c.causa==='Otra',err:c.de})}</div>${nav('mr-next','Revisar')}</div>`;
  /* Paso 3: resumen */
  let recap='',extra='';
  if(l){const inf=mermaInfo(l,c.tot,c.causa);recap=`<dt>Plantas del lote</dt><dd><span class="mono">${num(l.act)} → <b>${num(l.act-c.tot)}</b></span></dd><dt>Agujeros que se liberan</dt><dd>${c.rows.filter(r=>r.q).map(r=>`${r.s.n} (${r.q})`).join(', ')}</dd>${S.role==='cap'?'':`<dt>Valor de la pérdida</dt><dd><b class="mono">${money(inf.monto)}</b> <span class="muted">(${num(c.tot)} × ${money(inf.cp)}, costo por planta del lote)</span></dd>`}`;extra=inf.html}
  else{const rec=Math.max(0,c.tot-libPart(p));recap=`<dt>Partida</dt><dd><span class="mono">${num(p.disp)} → <b>${num(p.disp-c.tot)}</b></span>${p.disp-c.tot===0?' · queda agotada':''}</dd>${S.role==='cap'?'':`<dt>Valor de la pérdida</dt><dd><b class="mono">${money(c.tot*p.costo)}</b> <span class="muted">(${num(c.tot)} × ${money(p.costo)}, costo de la partida)</span></dd>`}`;
    extra=(rec?alertBox('warn',`<b>La pérdida alcanza ${num(rec)} ${rec===1?'planta reservada':'plantas reservadas'}.</b> Se recortan las reservas, primero las de compra-venta y después las de suministro. InfoPonia intenta cubrir la diferencia con otro stock; se avisa al Agrónomo y al Vendedor.`):'')+(S.role==='cap'?'':alertBox('info','La merma en cámara no suma a la merma del lote: esa medida es solo para las pérdidas antes de la cosecha.'))}
  return `<div class="page narrow">${bitBack()}${mrHead()}${pasos(2,'Resumen')}<div class="card"><dl class="dl"><dt>${l?'Lote':'Origen'}</dt><dd>${quien}</dd><dt>Plantas perdidas</dt><dd><b class="mono">${num(c.tot)}</b></dd><dt>Causa</dt><dd>${esc(c.causa)}${fv('desc')?` · <span class="muted">${esc(fv('desc'))}</span>`:''}</dd>${recap}<dt>Fecha</dt><dd>${fmt(HOY)}, hora actual</dd></dl></div><div class="stack tight" style="margin-top:12px">${extra}</div>${nav('mr-ok','Confirmar merma')}</div>`};
ACT['mr-next']=()=>{const c=mrCalc();if(S.step===0?!c.ok0:!c.ok1){S.att=true;rerender();return}S.att=false;S.step++;rerender();document.querySelector('main.main').scrollTop=0};
ACT['mr-ok']=()=>{const c=mrCalc();if(!c.ok1){S.att=true;rerender();return}const d=String(fv('desc')).trim(),items=[];let t;
  if(c.l){const l=c.l,inf=mermaInfo(l,c.tot,c.causa),r=aplicarMerma(l,c.rows.filter(x=>x.q).map(x=>[x.s.id,x.q]),c.causa);if(d)DB.bit[0].d+=' '+d;
    items.push(`${l.id}: ${pl(r.n,'planta')} menos. Quedan ${num(l.act)}.`,`Se liberaron agujeros en ${lista(c.rows.filter(x=>x.q).map(x=>x.s.n))}.`);if(S.role!=='cap')items.push(`Valor de la pérdida: ${money(r.monto)}.`);
    alertasMerma(l,true);if(inf.sup)items.push(`Alerta de umbral de merma para el Agrónomo y el Gerente (${inf.pct.toFixed(1).replace('.',',')} %).`);if(!l.act)items.push('El lote pasó a finalizado.');t=`${l.id} · ${vn(VAR(l.v))} · causa: ${c.causa.toLowerCase()}.`}
  else{const p=c.p,rec=Math.max(0,c.tot-libPart(p));p.disp-=c.tot;if(rec){p.res-=rec;alertar(['agr'],p.inv,'warn',`Merma en cámara con producto reservado: ${p.id}`,`Se recortaron ${num(rec)} plantas reservadas de ${vn(VAR(p.v))}. InfoPonia intenta cubrir el faltante.`,'cam');notify(INV(p.inv).ven,`Merma en cámara con producto reservado`,`Partida ${p.id} (${vn(VAR(p.v))}): se perdieron ${pl(c.tot,'planta')} y se recortaron ${num(rec)} reservadas. InfoPonia intenta cubrir la diferencia.`)}
    DB.bit.unshift({u:USERS[S.role].n,f:HOY,h:'10:00',inv:p.inv,t:'Merma',lote:p.lote,part:p.id,sec:[],d:`${pl(c.tot,'planta')} en cámara (partida ${p.id}). Causa: ${c.causa.toLowerCase()}.${d?' '+d:''}`});
    items.push(`Partida ${p.id}: ${pl(c.tot,'planta')} menos. Quedan ${num(p.disp)}${p.disp?'':' y queda agotada'}.`);if(S.role!=='cap')items.push(`Valor de la pérdida: ${money(c.tot*p.costo)}.`);if(rec)items.push(`Se recortaron ${num(rec)} plantas reservadas. Alerta para el Agrónomo y notificación al Vendedor.`);t=`Partida ${p.id} · ${vn(VAR(p.v))} · causa: ${c.causa.toLowerCase()}.`}
  S.ok={t,items};S.dirty=false;rerender();document.querySelector('main.main').scrollTop=0};

/* ---- Otro evento (CU-10 Registrar Evento): descripción libre ---- */
INIT.evento=()=>{S.f={inv:S.role==='cap'?mine()[0].id:(S.p.inv||'')};S.dirty=false};
ACT.evinv=()=>{delete S.f.lote;delete S.f.sec1};
VIEWS.evento=()=>{const cap=S.role==='cap',g=fv('inv')&&INV(fv('inv')),de=reqErr('desc','Describa el evento.')||(String(fv('desc')).length>500?'La descripción admite hasta 500 caracteres.':'');
  if(S.ok)return `<div class="page narrow">${alertBox('ok',`<b>Evento registrado en la bitácora</b><div>${S.ok}</div>`)}<div class="row" style="margin-top:18px"><button class="btn btn-primary" style="min-height:46px" ${bitGo()}>Volver</button></div></div>`;
  const secs=g?sectDe(g.id).filter(s=>s.est!=='inactivo'):[],lotes=g?lotesDe(g.id):[];
  return `<div class="page narrow">${bitBack()}<div class="page-h"><h1>Otro evento</h1><div class="sub">Para dejar constancia de un hecho que no es una merma ni una aplicación de insumos. Se registra con la fecha y la hora actuales.</div></div><div class="card">
    ${cap||S.p.inv?`<div class="fld"><span class="lbl">Invernadero</span><b class="lockedval">${esc(g.n)}</b></div>`:fld('inv','Invernadero',{req:true,then:'evinv',opts:mine().map(x=>[x.id,x.n]),err:reqErr('inv','Elija el invernadero.')})}
    ${g?`${fld('lote','Lote (opcional)',{opts:lotes.map(x=>[x.id,`${x.id} · ${vn(VAR(x.v))}`]),first:'Ninguno: es del invernadero',hint:'Si el evento afecta a un lote en particular.'})}
    ${fld('sec1','Sector (opcional)',{opts:secs.map(x=>[x.id,x.n]),first:'Ninguno: es del invernadero',hint:'Solo un sector. Si afecta a más de uno, regístrelo sin sector y cuéntelo en la descripción.'})}
    ${fld('desc','Descripción',{req:true,type:'textarea',err:de,ph:'Ej. Corte de energía de 40 minutos; el riego se restableció con el generador.',hint:`${String(fv('desc')).length} de 500 caracteres`,live:true})}`:''}</div>
    <div class="footbar"><button class="btn btn-primary" style="min-height:46px" data-act="ev-ok">Registrar evento</button><button class="btn btn-ghost" style="min-height:46px" ${bitCancel()}>Cancelar</button></div></div>`};
ACT['ev-ok']=()=>{const g=fv('inv')&&INV(fv('inv'));if(!g||reqErr('desc','x')||String(fv('desc')).length>500){S.att=true;rerender();return}const sec=fv('sec1')?[SEC(fv('sec1')).n]:[];
  DB.bit.unshift({u:USERS[S.role].n,f:HOY,h:'10:00',inv:g.id,t:'Otro evento',lote:fv('lote')||undefined,sec,d:String(fv('desc')).trim()});S.ok=`${g.n}${fv('lote')?' · '+fv('lote'):''}${sec.length?' · '+lista(sec):''} · ${fmt(HOY)}.`;S.dirty=false;rerender()};

init('agr');

</script>
