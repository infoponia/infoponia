<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfoPonia IoT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Mismo sistema visual que el prototipo de producción v2: tema claro, Inter, verde InfoPonia, estados semánticos aparte del acento. */
:root{color-scheme:light;
--background:#f5f6f8;--foreground:#141a21;--card:#fff;--subtle:#f9fafb;
--primary:#1a6b3c;--primary-dark:#145431;--primary-soft:#eaf5ee;
--secondary:#eef1f4;--muted:#eef0f3;--muted-foreground:#5f6b78;--faint:#8a94a0;
--border:#e3e7ec;--border-strong:#cfd5dc;--radius:10px;--radius-sm:7px;
--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.04);
--shadow-pop:0 12px 32px rgba(16,24,40,.14),0 2px 6px rgba(16,24,40,.06);
--status-ok:#18784a;--status-warn:#9a5b00;--status-danger:#b42828;--status-neutral:#5a6573;
--ok-bg:#e9f6ef;--warn-bg:#fdf3e1;--danger-bg:#fdecec;--neutral-bg:#eef1f4;
--font-sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:var(--font-sans);font-size:14px;background:var(--background);color:var(--foreground);line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1{font-size:22px;font-weight:650;letter-spacing:-.015em;line-height:1.25;text-wrap:balance}
h3{font-size:14px;font-weight:600}
b,strong{font-weight:600}
.muted{color:var(--muted-foreground)}.faint{color:var(--faint)}.sm{font-size:13px}.xs{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}
.id{display:inline-block;font-size:12px;font-weight:600;color:var(--muted-foreground);background:var(--secondary);border-radius:5px;padding:1px 6px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:550;border:1px solid transparent;min-height:38px;white-space:nowrap;line-height:1.2;transition:background .12s}
.btn:focus-visible,.chip:focus-visible,.nav-item:focus-visible,.link:focus-visible,.kb-btn:focus-visible,.menu button:focus-visible,.back:focus-visible,.rowlink:focus-visible,.tab:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:#fff;color:var(--primary);border-color:color-mix(in srgb,var(--primary) 55%,#fff)}.btn-ghost:hover{background:var(--primary-soft)}
.btn-danger{background:#fff;color:var(--status-danger);border-color:color-mix(in srgb,var(--status-danger) 45%,#fff)}.btn-danger:hover{background:var(--danger-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:5px 11px;font-size:13px;min-height:32px}
.field-input{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 12px;background:#fff;outline:none;min-height:40px}
.field-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,107,60,.14)}
.field-input.bad{border-color:var(--status-danger)}
.field-input:disabled{background:var(--muted);color:var(--muted-foreground)}
.field-input.num{max-width:150px;text-align:right}
.fld{margin-bottom:18px;min-width:0}.fld label,.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#2a333d}
.req{color:var(--status-danger)}.err{color:var(--status-danger);font-size:13px;margin-top:6px}.hint{color:var(--muted-foreground);font-size:13px;margin-top:6px}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:550;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.status-ok{background:var(--ok-bg);color:var(--status-ok)}.status-warn{background:var(--warn-bg);color:var(--status-warn)}
.status-danger{background:var(--danger-bg);color:var(--status-danger)}.status-neutral{background:var(--neutral-bg);color:var(--status-neutral)}
.status-info{background:#e7effb;color:#1d4f9c}
.alert{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-radius:var(--radius-sm);font-size:13.5px;border:1px solid;line-height:1.55}
.alert svg{flex-shrink:0;margin-top:2px}.alert ul{margin:6px 0 0 18px}
.alert-warn{background:#fffaf0;border-color:#f3dcb0;color:#5e3b00}.alert-danger{background:#fff6f6;border-color:#f2c9c9;color:#7a1c1c}
.alert-ok{background:#f3faf6;border-color:#c5e6d3;color:#134a2c}.alert-info{background:#f6f8fa;border-color:var(--border);color:#2d3742}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.data-table{width:100%;border-collapse:collapse;font-size:14px}
.data-table th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted-foreground);padding:11px 16px;background:var(--subtle);border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tr.sub td{background:var(--subtle);padding:8px 16px 14px 28px;font-size:13px}
.data-table .sub2{display:block;font-size:13px;color:var(--muted-foreground)}
.rowlink{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-weight:550;font-size:13px;background:none;border:none;padding:6px 8px;border-radius:6px}
.rowlink:hover{background:var(--primary-soft)}.rowlink:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--border);background:var(--subtle);min-height:50px;flex-wrap:wrap}
.card-h h3{display:flex;align-items:center;gap:8px}.card-h h3 svg{color:var(--muted-foreground)}
.card-b{padding:18px 20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--border)}
.facts>div{background:#fff;padding:13px 20px;min-width:0}
.facts .k{display:block;font-size:12.5px;color:var(--muted-foreground);margin-bottom:3px}
.facts .v{display:block;font-size:14.5px;font-weight:550;overflow-wrap:anywhere}
.facts .d{display:block;font-size:13px;color:var(--muted-foreground);margin-top:2px}
.stack{display:grid;gap:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.proto{border:1.5px dashed #b5bdc6;border-radius:var(--radius-sm);padding:12px 14px;background:#fafbfb;font-size:13px}
.proto-title{font-weight:600;font-size:12px;color:var(--muted-foreground);margin-bottom:8px}
.link{background:none;border:none;color:var(--primary);font-weight:550;text-decoration:underline;text-underline-offset:2px;padding:0}
.shell{position:relative;height:100%;display:grid;grid-template-rows:56px 1fr 34px;grid-template-columns:224px minmax(0,1fr);overflow:hidden}
.shell>header,.shell>footer{grid-column:1/-1}
header.top{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:15.5px;font-weight:650}
.logo{width:32px;height:32px;background:var(--primary);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff}
.rolesel{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-foreground)}
.rolesel select{width:auto;min-height:36px}
aside.side{background:#fff;border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.side-label{font-size:11.5px;font-weight:600;color:var(--faint);padding:4px 12px 8px;letter-spacing:.06em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);color:#46515d;font-weight:500;background:none;border:none;text-align:left;width:100%}
.nav-item:hover{background:var(--secondary)}.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item.off{opacity:.5;cursor:default}.nav-item.off:hover{background:none}
main.main{overflow:auto;padding:26px 32px 0;min-width:0}
footer.bot{display:flex;align-items:center;gap:16px;padding:0 20px;font-size:12px;color:var(--muted-foreground);background:#fff;border-top:1px solid var(--border)}
.page{max-width:1360px;margin:0 auto;padding-bottom:32px}.page.narrow{max-width:980px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-h .sub{color:var(--muted-foreground);flex-basis:100%;margin-top:-6px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted-foreground);font-weight:500;background:none;border:none;padding:4px 6px 4px 2px;margin-bottom:12px;border-radius:6px}
.back:hover{color:var(--primary);background:var(--primary-soft)}
.ctx{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.ctx .field-input{width:auto;min-width:210px}
.ov{position:absolute;inset:0;background:rgba(17,24,32,.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:540px;padding:24px 26px;max-height:100%;overflow:auto;box-shadow:var(--shadow-pop)}
.modal h3{font-size:17px;margin-bottom:10px}.modal p{margin-bottom:12px}.modal .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.kb{position:relative;display:inline-flex}
.kb-btn{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 8px;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted-foreground)}
.kb-btn:hover{background:var(--secondary)}
.menu{position:absolute;right:0;top:calc(100% + 4px);min-width:230px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);z-index:70;padding:5px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:none;background:none;border-radius:7px;font-weight:500;white-space:nowrap;text-align:left}
.menu button:hover{background:var(--secondary)}.menu button.danger{color:var(--status-danger)}
#toasts{position:fixed;top:66px;right:16px;z-index:300;display:grid;gap:8px;width:min(380px,calc(100vw - 24px))}
.toast{display:flex;gap:10px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--tc);border-radius:10px;box-shadow:var(--shadow-pop);padding:12px 14px;font-size:13.5px}
.toast svg{color:var(--tc);flex-shrink:0;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow)}
.kpi .k{font-size:13px;color:var(--muted-foreground)}.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em}.kpi .v small{font-size:15px;color:var(--muted-foreground)}
.kpi.danger .v{color:var(--status-danger)}.kpi.warn .v{color:var(--status-warn)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.sens{background:#fff;border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sens.muted-card{background:#f7f8f9}.sens.muted-card .big{color:var(--faint)}
.sens .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.big{font-size:26px;font-weight:650;letter-spacing:-.02em}.big small{font-size:14px;color:var(--muted-foreground);font-weight:500;margin-left:3px}
.spark{width:100%;height:84px;display:block}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--border-strong);background:#fff;font-weight:500;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--primary);color:var(--primary)}.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.sentence{font-size:15px;line-height:1.7}.sentence b{background:var(--primary-soft);color:var(--primary-dark);padding:1px 7px;border-radius:6px}
.blk{background:#f3f5f7;border:1px solid #c3cbd4;border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.accrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.bar{height:8px;border-radius:999px;background:var(--muted);position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--primary)}
.tokenbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#f3f5f7;border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere;margin-bottom:10px}
@media(max-width:860px){.stackrows tr{display:block;padding:12px 16px;border-bottom:1px solid var(--border)}.stackrows td{display:block;padding:2px 0;border:none;width:auto!important}.stackrows td.right{text-align:left;padding-top:8px}.stackrows thead{display:none}.stackrows tr.sv td:first-child{box-shadow:none}header.top{padding:0 12px}.brand .status-badge{display:none}.rolesel select{max-width:170px}.page{min-width:0}.shell{grid-template-columns:minmax(0,1fr)}aside.side{display:none}main.main{padding:18px 16px 0}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.accrow{grid-template-columns:1fr 1fr}.rolesel span{display:none}.chips.one{flex-wrap:wrap}.sgrid{grid-template-columns:minmax(0,1fr)}}

/* Pestañas del módulo (mismo recurso que las barras de las pantallas de producción) */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;scrollbar-width:thin}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;margin-bottom:-1px;font-weight:550;color:var(--muted-foreground);white-space:nowrap;font-size:14px}
.tab:hover{color:var(--foreground)}.tab[aria-current="page"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
/* Filtros con combos, como en el resto del sistema */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filters .field-input{width:auto;min-width:170px}.filters .field-input.q{min-width:260px}
/* Alertas con severidad */
.sv td:first-child{box-shadow:inset 4px 0 0 var(--sc,#c3cbd4)}
.sv-alta{--sc:var(--status-danger)}.sv-alta td{background:#fffafa}.sv-media{--sc:#d99a2b}.sv-baja{--sc:#6b95d6}
/* Sensores agrupados por variable */
.grp+.grp{margin-top:22px}
.grp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.grp-h b{font-size:14.5px}
.umb{background:var(--primary-soft);color:var(--primary-dark);padding:2px 11px;border-radius:999px;font-size:12.5px;font-weight:550}
.sgrid{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.sens{gap:6px;padding:14px 16px}
.sens .sh{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-height:26px}
.sens .sh .xs{white-space:nowrap}
.spark{height:auto;aspect-ratio:360/96}
.spark.empty{display:flex;align-items:center;justify-content:center;background:var(--subtle);border:1px dashed var(--border-strong);border-radius:8px;color:var(--muted-foreground);font-size:13px;aspect-ratio:auto;height:96px}
.card-h select.field-input{width:auto;min-height:34px;padding:5px 30px 5px 10px}
/* Variedades como etiquetas */
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--subtle);border-radius:999px;padding:4px 13px 4px 10px;font-size:13px}
.vchip .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}.vchip .dot.next{background:#6b95d6}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.accchips{display:flex;flex-wrap:wrap;gap:6px}
.accchip{display:inline-flex;gap:6px;align-items:center;background:var(--secondary);border-radius:999px;padding:2px 11px;font-size:13px;white-space:nowrap}.accchip small{color:var(--muted-foreground);font-size:12px}
.chips.one{flex-wrap:nowrap}
/* Barra de contexto (invernadero) */
.ctxbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 16px;margin-bottom:14px}
.ctxbar .lbl{margin:0;white-space:nowrap}.ctxbar select{width:auto;min-width:250px;font-weight:600}
/* Grupos de sensores plegables */
.gcard{border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;background:#fff}.gcard+.gcard{margin-top:16px}
.gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;background:#e9efeb;border:none;padding:11px 16px;text-align:left;color:var(--foreground)}.gh:hover{background:#e1e9e4}
.gh b{font-size:14.5px}.gh svg{color:var(--muted-foreground)}.gcard.open .gh{border-bottom:1px solid var(--border-strong)}
.gb{padding:16px;background:#f6f8f9}
.accchip{background:#d9e0e7}.accchip small{color:#46515d}
.accl1{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:end}.accl2{display:grid;grid-template-columns:repeat(3,minmax(0,200px));gap:12px;margin-top:12px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:40px;font-size:13.5px;font-weight:550;cursor:pointer}.chk input{accent-color:var(--primary);width:16px;height:16px}
@media(max-width:860px){.accl1{grid-template-columns:minmax(0,1fr) auto}.accl2{grid-template-columns:1fr}}
.accl1 label.xs,.accl2 label{display:block;margin-bottom:4px}
.sech{font-size:13.5px;font-weight:650;margin:6px 0 12px;padding-top:6px;color:#2a333d}.sech:first-child{margin-top:0;padding-top:0}
.fotline{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--border);padding-top:8px;margin-top:2px;font-size:13px;color:#2d3742}.fotline svg{color:var(--muted-foreground)}
.spark.nivel{height:auto;min-height:64px;font-weight:550}.spark.nivel.bad{background:#fff6f6;border-color:#f2c9c9;color:var(--status-danger)}
.warn-t{color:var(--status-warn)!important;display:flex!important;align-items:center;gap:4px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#46515d}.accchip .code{margin-left:2px;opacity:.8}
.blist{margin:0 0 12px 18px;font-size:14px;line-height:1.9}.blist .id{margin:0 4px}
.accl1{grid-template-columns:minmax(0,1fr) minmax(0,220px) auto}

/* v8.2 · Más contraste: fondo de página tintado, cuadros blancos con borde y sombra más marcados, encabezados y avisos con color */
:root{--background:#e6ebef;--border:#cbd3db;--border-strong:#b4bec9;--subtle:#edf2ef;
--shadow:0 1px 2px rgba(16,24,40,.10),0 2px 6px rgba(16,24,40,.06)}
.card,.tablewrap,.kpi,.ctxbar,.gcard,.sens{border-color:var(--border-strong)}
.card-h{background:#e4ece7;border-bottom-color:var(--border-strong)}
.data-table th{background:#e4ece7;border-bottom-color:var(--border-strong);color:#3f4a56}
.data-table tr.sub td{background:#eef3f0}
.kpi{border-top:3px solid var(--primary)}.kpi.danger{border-top-color:var(--status-danger)}.kpi.warn{border-top-color:#d99a2b}
.ctxbar{background:#f4f8f5;border-left:4px solid var(--primary)}
.facts{background:var(--border-strong)}
.facts>div{background:#f7faf8}
.blk{background:#e9eef2;border-color:#aeb9c5}
.tokenbox{background:#e9eef2;border-color:#aeb9c5}
.alert-info{background:#e8f0fb;border-color:#a9c2e6;color:#1f3558}
.alert-warn{background:#fff4dc;border-color:#e8c98a}.alert-danger{background:#fde8e8;border-color:#eaa9a9}.alert-ok{background:#e5f4ec;border-color:#a3d4b9}
.sv-alta td{background:#fff1f1}
.sens.muted-card{background:#eef1f4}
.proto{background:#f1f4f6;border-color:#9aa6b2}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={

 if(s&&s.estado==='desconectado')w=W('danger','El sistema está desconectado. No se pueden emitir comandos hasta activarlo.');
 else if(h&&h.estado==='fuera de servicio')w=W('danger','Este actuador está fuera de servicio. Volvé a activarlo desde Hardware antes de emitir comandos.');
 else if(pend)w=W('danger',`Ya hay un comando pendiente para este actuador (${pend.id}). Cancelalo o esperá su resultado: solo se admite uno por actuador.`);
 else if(h){
  if(s.conn==='sin señal')w+=W('warn','El nodo está sin señal. El comando queda pendiente, sin consumir intentos, hasta que el nodo se comunique.');
  if(s.modo==='local')w+=W('warn','El nodo está operando en modo local. El comando queda pendiente, sin consumir intentos, hasta que vuelva a «remoto».');
  if(!h.rep)w+=W('warn','Del actuador nunca llegó ningún mensaje. Si su identificador está mal cargado, el comando no se va a ejecutar.');
  if(h.inc&&h.inc.length)w+=W('warn',`El nodo no soporta: ${h.inc.join(', ')}. Esas acciones no se ofrecen (alerta «Configuración incompatible»).`);
  if(h.lastSec!=null&&h.lastSec<tipoDe(h).tmin)w+=W('warn',`El actuador cambió de estado ${ago(h.lastSec)}. Cambiarlo tan seguido puede dañar el equipo: faltan ${tipoDe(h).tmin-h.lastSec} s para cumplir el tiempo mínimo entre comandos. Podés emitirlo igual.`);
  if(a&&h.est&&mismoEstado(a,h))w+=W('info',`Según el último estado que informó el nodo, el actuador ya está ${h.est.txt.toLowerCase()}. El nodo lo informará como ejecutado sin cambiar nada.`);
  const rg=DB.reglas.filter(r=>r.act===h.id&&r.estado==='activa');if(rg.length)w+=W('info',`El actuador tiene ${rg.length} regla(s) activa(s) (${rg.map(r=>r.id).join(', ')}): este comando puede contradecirlas.`)}
 const block=(h&&(h.estado!=='activo'||pend))||(s&&s.estado!=='activo');
 return `<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>${ic('send')}Emitir comando</h3>${h?`<span class="spacer"></span><span class="sm">Estado informado: ${estInf(h,1)}</span>`:''}</div><div class="card-b"><div class="grid2">`+
 fld('Actuador','cact',sl('cact',acts.map(x=>[x.id,hwLbl(x)]),'data-ch="c-act"','Seleccioná un actuador'),'',true)+
 fld('Acción','cacc',h?sl('cacc',accsOk(h).map(x=>[x.n,x.n]),'data-ch="c-acc"','Seleccioná la acción'):'<select class="field-input" disabled><option>Primero elegí el actuador</option></select>','',true)+`</div>`+
 (hasVal(a)?fld(`Valor (${a.u})`,'cval',nm('cval'),`Número entero entre ${a.min} y ${a.max} ${a.u}.`,true):'')+w+
 `<div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="emit" ${block?'disabled':''}>${ic('send')}Emitir comando</button><span class="xs muted">El nodo lo retira en su próxima consulta. Hasta ${maxInt()} intentos, uno cada ${DB.cfg.interv} s.</span></div></div></div>`;
}
function mismoEstado(a,h){const m={ENCENDER:'ENCENDIDO',APAGAR:'APAGADO',ABRIR:'ABIERTA',CERRAR:'CERRADA'};return m[a.cmd]&&h.est.s===m[a.cmd]}
function comandos(){
 const op=canOp(),s=sys();
 let o=ph('Comandos','Órdenes enviadas a los actuadores, con sus intentos y resultado.')+`<div class="stack">`+opBanner();
 if(!s)return o+`<div class="alert alert-warn">${ic('alert')}<div>Este invernadero no tiene Sistema IoT.</div></div></div>`;
 if(op)o+=cmdForm();
 const CF=S.cmdF,hasC=CF.estado!=='todos'||CF.act!=='todos'||CF.origen!=='todos';
 const list=DB.comandos.filter(c=>c.inv===S.inv&&(CF.estado==='todos'||c.estado===CF.estado)&&(CF.act==='todos'||c.act===CF.act)&&(CF.origen==='todos'||(CF.origen==='manual'?c.origen.startsWith('Manual'):c.origen.startsWith('Regla'))));
 const co=(k,l,opts)=>`<select class="field-input" data-ch="cf-${k}" aria-label="${l}">${opts.map(x=>`<option value="${x[0]}" ${CF[k]===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
 const aopts=DB.hw.filter(h=>h.inv===S.inv&&h.tipo==='actuador').map(h=>[h.id,hwLbl(h)]);
 o+=`<div class="filters">${co('estado','Estado',[['todos','Todos los estados'],['pendiente','Pendientes'],['ejecutado','Ejecutados'],['fallido','Fallidos'],['cancelado','Cancelados']])}${co('act','Actuador',[['todos','Todos los actuadores']].concat(aopts))}${co('origen','Origen',[['todos','Todos los orígenes'],['manual','Manual'],['regla','Regla de actuación']])}${hasC?`<button class="btn btn-ghost btn-sm" data-act="cmdf-clear">Limpiar filtros</button>`:''}</div>`;
 const loc=s.modo==='local';
 o+=`<div class="tablewrap"><table class="data-table"><thead><tr><th>Código</th><th>Actuador y acción</th><th>Origen</th><th>Estado</th><th>Intentos</th><th>Último intento</th><th></th></tr></thead><tbody>${list.map(c=>{const h=gh(c.act),ad=accDe(h,c.acc)||{};
  return `<tr><td><span class="id">${c.id}</span></td><td><b>${hwName(h)}</b> <span class="muted sm">${esc(h.ident)}</span><span class="sub2">${c.acc}${c.val!==''?' · '+c.val+' '+(ad.u||''):''} <span class="code">${ad.cmd||''}</span></span></td><td class="sm">${c.origen}</td><td>${cmdBadge(c.estado,c.rech)}</td><td>${c.int} de ${maxInt()}</td><td class="muted">${c.ult}</td><td class="right">${c.estado==='pendiente'?`<button class="rowlink" data-act="modal" data-arg="ccan:${c.id}" ${op&&!c.enCurso?'':'disabled'} title="${c.enCurso?'Hay un intento en curso: no se puede cancelar':''}">Cancelar</button>`:''}</td></tr>`+
  (c.estado==='fallido'?`<tr class="sub"><td colspan="7"><div class="alert ${c.rech?'alert-warn':'alert-danger'}">${ic('alert',16)}<div>${c.nota}</div></div></td></tr>`:'')+
  (c.estado==='pendiente'?`<tr class="sub"><td colspan="7"><div class="proto"><div class="proto-title">SOLO PROTOTIPO · simula la respuesta del nodo</div>${loc?'<div class="sm muted">El nodo está en modo local: no se le entregan comandos y no se consumen intentos.</div>':`<div class="row"><button class="btn btn-ghost btn-sm" data-act="sim-ok" data-arg="${c.id}">El nodo confirma la ejecución</button><button class="btn btn-ghost btn-sm" data-act="sim-fail" data-arg="${c.id}">Intento sin respuesta</button><button class="btn btn-ghost btn-sm" data-act="sim-rech" data-arg="${c.id}">El nodo no reconoce el comando</button></div>`}</div></td></tr>`:'')}).join('')||'<tr><td colspan="7" class="muted">No hay comandos con estos filtros.</td></tr>'}</tbody></table></div></div>`;
 return o;
}
/* ===== Reglas de actuación (IOT-ALT/MOD/BAJ/CNS-RGL) ===== */
function rglText(r){const s=gh(r.sensor),a=gh(r.act),ad=accDe(a,r.acc)||{};return `Cuando <b>${hwName(s)} ${esc(s.ident)}</b> ${COND[r.cond]}, <b>${hwName(a)} ${esc(a.ident)}</b>: ${r.acc}${r.val!==''?' '+r.val+(ad.u?' '+ad.u:''):''}`}
function ultB(r){return r.ult==='cumplida'?bd('warn','Se cumple'):r.conf>0?bd('info',`Confirmando ${r.conf} de ${DB.cfg.conf}`):r.ult==='no cumplida'?bd('neutral','No se cumple'):bd('neutral','Sin evaluar')}
function rglTags(r){const a=gh(r.act),s=DB.sistemas[r.inv],t=[];
 if(a.estado==='fuera de servicio')t.push(bd('danger','No emite: actuador fuera de servicio'));
 if((a.inc||[]).includes(r.acc))t.push(bd('warn','No emite: acción incompatible con el nodo'));
 if(!DB.umb[r.inv])t.push(bd('neutral','No se evalúa: sin umbral efectivo'));
 if(s&&s.modo==='local')t.push(bd('warn','No se evalúa: nodo en modo local'));
 return t.join('')}
const rglSensors=()=>DB.hw.filter(h=>h.inv===S.inv&&h.tipo==='sensor'&&h.estado==='activo'&&VARS[h.var].rules&&!INVS[S.inv].off.includes(h.sector));
function reglas(){
 const op=canOp(),s=sys(),v=S.v;
 if(v&&v.n==='rgl-form'){const mod=!!v.id;
  const sens=rglSensors(),acts=DB.hw.filter(h=>h.inv===S.inv&&h.tipo==='actuador'&&h.estado!=='baja');
  const a=gh(F('ract')),ac=a&&accDe(a,F('racc'));
  const prev=F('rsensor')&&F('rcond')&&a&&F('racc')&&(!hasVal(ac)||F('rval')!=='')?rglText({sensor:F('rsensor'),cond:F('rcond'),act:F('ract'),acc:F('racc'),val:F('rval')}):'';
  return `<button class="back" data-act="nav" data-arg="reglas">${ic('back')}Volver</button>`+ph(mod?'Modificar regla':'Nueva regla de actuación',INVS[S.inv].n)+`<div class="page narrow" style="padding:0"><div class="card"><div class="card-b">`+
  (mod?`<div class="fld"><label>Cuando el sensor…</label><input class="field-input" value="${esc(hwLbl(gh(F('rsensor'))))}" disabled><div class="hint">El sensor y el actuador no se cambian: para otros, se crea una regla nueva.</div></div>`:fld('Cuando el sensor…','rsensor',sl('rsensor',sens.map(h=>[h.id,hwLbl(h)+' · '+(h.sector||'General')]),'','Seleccioná un sensor'),'Solo temperatura, humedad e intensidad lumínica. La solución nutritiva y el fotoperíodo se monitorean con alertas.',true))+
  `<div class="fld"><span class="lbl">…y la lectura</span><div class="chips one">${Object.keys(COND).map(k=>`<button class="chip" aria-pressed="${F('rcond')===k}" data-act="r-cond" data-arg="${k}">${COND[k]}</button>`).join('')}</div><div class="hint">Dispara una vez, cuando la condición se cumple en ${DB.cfg.conf} lecturas seguidas. Deja de cumplirse recién cuando la lectura se aleja del límite más que la histéresis, y respeta el tiempo mínimo entre comandos del actuador.</div>${S.err.rcond?`<div class="err">${S.err.rcond}</div>`:''}</div>`+
  `<div class="grid2">`+(mod?`<div class="fld"><label>…entonces el actuador</label><input class="field-input" value="${esc(hwLbl(a))}" disabled></div>`:fld('…entonces el actuador','ract',sl('ract',acts.map(h=>[h.id,hwLbl(h)]),'data-ch="r-act"','Seleccioná un actuador'),'',true))+fld('Acción','racc',a?sl('racc',accsOk(a).map(x=>[x.n,x.n]),'data-ch="r-acc"','Seleccioná la acción'):'<select class="field-input" disabled><option>Primero elegí el actuador</option></select>',a&&a.inc&&a.inc.length?`No se ofrecen las acciones que el nodo no soporta: ${a.inc.join(', ')}.`:'',true)+`</div>`+
  (hasVal(ac)?fld(`Valor (${ac.u})`,'rval',nm('rval'),`Número entero entre ${ac.min} y ${ac.max} ${ac.u}.`,true):'')+
  (prev?`<div class="alert alert-info" style="margin-bottom:14px">${ic('info')}<div class="sentence">${prev}</div></div>`:'')+
  (!DB.umb[S.inv]?`<div class="alert alert-warn" style="margin-bottom:14px">${ic('alert')}<div>Este invernadero no tiene umbral efectivo: la regla se guarda, pero no se evalúa hasta que lo tenga.</div></div>`:'')+
  `<div class="row"><button class="btn btn-primary" data-act="save-rgl">${mod?'Guardar cambios':'Crear regla'}</button><button class="btn btn-ghost" data-act="nav" data-arg="reglas">Cancelar</button></div></div></div></div>`}
 let o=ph('Reglas de actuación','Un sensor dispara una acción sobre un actuador del mismo invernadero.',op&&s?`<button class="btn btn-primary" data-act="rgl-new">${ic('plus')}Nueva regla</button>`:'')+`<div class="stack">`+opBanner();
 if(!s)return o+`<div class="alert alert-warn">${ic('alert')}<div>Este invernadero no tiene Sistema IoT.</div></div></div>`;
 const l=DB.reglas.filter(r=>r.inv===S.inv&&r.estado!=='baja');
 o+=`<div class="tablewrap"><table class="data-table"><thead><tr><th>Código</th><th>Regla</th><th>Situación</th><th></th></tr></thead><tbody>${l.map(r=>`<tr><td><span class="id">${r.id}</span></td><td>${rglText(r)}</td><td><div class="tags">${ultB(r)}${rglTags(r)}</div></td><td class="right">${op?menu('r'+r.id,[['rgl-mod','Modificar',r.id],['modal','Dar de baja','rbaj:'+r.id,'danger','trash']]):''}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No hay reglas en este invernadero.</td></tr>'}</tbody></table></div>
</div>`;
 return o;
}

/* ===== Tipos de actuador (IOT-ALT/MOD/BAJ/CNS-TAC) ===== */
const cmdOpts=()=>CAPS.map(c=>`<optgroup label="${c.n}">${c.cmds.map(x=>`<option value="${x[0]}">${x[0]}${x[1]?' (con valor)':''}</option>`).join('')}</optgroup>`).join('');
const enUsoTac=(t,n)=>{const ids=DB.hw.filter(h=>h.tipoAct===t.id&&h.estado!=='baja').map(h=>h.id);return DB.reglas.filter(r=>r.estado==='activa'&&ids.includes(r.act)&&r.acc===n).map(r=>r.id).concat(DB.comandos.filter(c=>c.estado==='pendiente'&&ids.includes(c.act)&&c.acc===n).map(c=>c.id))};
const histTac=(t,n)=>{const ids=DB.hw.filter(h=>h.tipoAct===t.id).map(h=>h.id);return DB.comandos.some(c=>ids.includes(c.act)&&c.acc===n)};
function tipos(){
 const adm=S.role==='gerente';
 const v=S.v;
 if(v&&v.n==='tac-form'){const mod=!!v.id,t=mod&&DB.tipos.find(x=>x.id===v.id);
  const rows=v.acc.map((a,i)=>{if(a.activa===false)return '';const lock=mod&&a.o&&histTac(t,a.o),val=CMDV[a.cmd]&&CMDV[a.cmd].val;
   return `<div class="blk"><div class="accl1"><div><label class="xs muted" for="an${i}">Nombre de la acción</label><input id="an${i}" class="field-input" data-ai="${i}" data-af="n" value="${esc(a.n)}" placeholder="Ej.: Fijar velocidad"></div><div><label class="xs muted" for="ac${i}">Comando del catálogo</label><select id="ac${i}" class="field-input" data-ai="${i}" data-af="cmd" ${lock?'disabled title="Tiene comandos en su historial: no cambia su comando"':''}><option value="">Seleccioná</option>${cmdOpts().replace(`value="${a.cmd}"`,`value="${a.cmd}" selected`)}</select></div><button class="btn btn-ghost btn-sm" data-act="acc-del" data-arg="${i}" aria-label="Quitar acción">${ic('trash')}</button></div>${val?`<div class="accl2"><div><label class="xs muted" for="amin${i}">Valor mínimo</label><input id="amin${i}" class="field-input num" inputmode="numeric" data-ai="${i}" data-af="min" value="${esc(a.min==null?'':a.min)}"></div><div><label class="xs muted" for="amax${i}">Valor máximo</label><input id="amax${i}" class="field-input num" inputmode="numeric" data-ai="${i}" data-af="max" value="${esc(a.max==null?'':a.max)}"></div><div><label class="xs muted" for="au${i}">Unidad</label><select id="au${i}" class="field-input" data-ai="${i}" data-af="u" ${lock||(mod&&a.o&&enUsoTac(t,a.o).length)?'disabled title="La acción está en uso o tiene comandos en su historial: su unidad no se cambia"':''}>${unidOpts(a.cmd,a.u)}</select></div></div>`:''}${lock?`<div class="hint">Tiene comandos en su historial: su comando y su unidad no se cambian.</div>`:''}</div>`}).join('');

  (mod&&DB.hw.some(h=>h.tipoAct===v.id&&h.estado!=='baja')?`<div class="alert alert-info" style="margin-bottom:16px">${ic('info')}<div>Los cambios afectan a ${DB.hw.filter(h=>h.tipoAct===v.id&&h.estado!=='baja').length} equipo(s) de este tipo.</div></div>`:'')+
  `<div class="grid2">`+fld('Nombre del tipo','tnom',tx('tnom'),'Ej.: Extractor de aire.',true)+fld('Tiempo mínimo entre comandos (segundos)','ttmin',tx('ttmin','inputmode="numeric"'),'Protege el equipo de cambios demasiado seguidos.',true)+`</div>`+
  `<div class="lbl">Acciones que admite <span class="req">*</span></div>`+rows+

  <div style="margin-top:20px">${v.cw?`<div class="alert alert-warn" style="margin-bottom:0">${ic('alert')}<div>Con estas acciones quedarían incompatibles con el último anuncio de su nodo:<ul>${v.cw.map(x=>`<li>${x}</li>`).join('')}</ul>Podés guardar igual: esas acciones no se ofrecerán en esos actuadores y se generará la alerta «Configuración incompatible».</div></div>`:''}<div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="save-tac">${mod?(v.cw?'Guardar igual':'Guardar cambios'):'Crear tipo'}</button><button class="btn btn-ghost" data-act="nav" data-arg="tipos">Cancelar</button></div></div></div></div></div>`}
 return ph('Tipos de actuador','Definen qué acciones admite cada clase de equipo y con qué comando del catálogo se ejecutan.',adm?`<button class="btn btn-primary" data-act="tac-new">${ic('plus')}Nuevo tipo</button>`:'')+
 (adm?'':`<div class="alert alert-info" style="margin-bottom:14px">${ic('info')}<div>Los tipos de actuador los administra el Gerente porque son comunes a toda la organización: un cambio afecta a los equipos de todos los invernaderos. Podés consultarlos; si necesitás un tipo nuevo o un cambio, pedíselo.</div></div>`)+
 `<div class="stack"><div class="tablewrap"><table class="data-table"><thead><tr><th>Código</th><th>Tipo</th><th>Acciones</th><th>Tiempo mínimo</th><th>Equipos</th>${adm?'<th></th>':''}</tr></thead><tbody>${DB.tipos.map(t=>{const n=DB.hw.filter(h=>h.tipoAct===t.id&&h.estado!=='baja').length;return `<tr><td><span class="id">${t.id}</span></td><td><b>${t.n}</b></td><td><div class="accchips">${t.acc.filter(a=>a.activa!==false).map(a=>`<span class="accchip">${a.n}${a.min!=null?` <small>${a.min} a ${a.max} ${a.u||''}</small>`:''}<small class="code">${a.cmd}</small></span>`).join('')}</div></td><td>${t.tmin} s</td><td>${n}</td>${adm?`<td class="right">${menu('t'+t.id,[['tac-mod','Modificar',t.id],['modal','Dar de baja','tbaj:'+t.id,'danger','trash']])}</td>`:''}</tr>`}).join('')}</tbody></table></div>
 <div class="card"><div class="card-h"><h3>${ic('lock')}Catálogo de capacidades</h3><span class="spacer"></span><span class="xs muted">Forma parte del contrato de la API con el nodo · no se edita</span></div><table class="data-table"><thead><tr><th>Capacidad</th><th>Comandos</th></tr></thead><tbody>${CAPS.map(c=>`<tr><td><b>${c.n}</b></td><td><div class="accchips">${c.cmds.map(x=>`<span class="accchip code">${x[0]}${x[1]?' <small>con valor</small>':''}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table></div></div>`;
}

 const m=S.modal;if(!m)return '';const [k,id]=(m.t||'').split(':');let b='';
 const acts=(ok,lbl,danger)=>`<div class="acts">${ok?`<button class="btn ${danger?'btn-danger':'btn-primary'}" data-act="m-ok">${lbl}</button>`:''}<button class="btn btn-ghost" data-act="close">${ok?'Volver':'Entendido'}</button></div>`;

 else if(k==='regen')b=`<h3>Regenerar token</h3><p>El token actual <b>deja de funcionar de inmediato</b> y el nodo dejará de comunicarse hasta que cargues el nuevo. El token nuevo se muestra una sola vez.</p>`+acts(1,'Regenerar token',1);
 else if(k==='desc')b=`<h3>Desconectar el sistema</h3><p>Mientras esté desconectado, InfoPonia no acepta mensajes del nodo, no evalúa reglas, no genera alertas y no entrega comandos. Los comandos pendientes se cancelan y las alertas activas se resuelven. Podés activarlo de nuevo cuando quieras.</p>`+acts(1,'Desconectar');
 else if(k==='baj'&&!id){const p=DB.comandos.filter(c=>c.inv===S.inv&&c.estado==='pendiente'),hs=DB.hw.filter(h=>h.inv===S.inv&&h.estado!=='baja'),ot=DB.ordenes.filter(o=>o.estado==='abierta'&&hs.some(h=>h.id===o.act)),rg=DB.reglas.filter(r=>r.inv===S.inv&&r.estado==='activa');
  b=`<h3>Dar de baja el Sistema IoT</h3>`+(p.length||ot.length?`<div class="alert alert-danger">${ic('alert')}<div>No se puede dar de baja todavía:<ul>${p.length?`<li>Hay ${p.length} comando(s) pendiente(s) (${p.map(c=>c.id).join(', ')}). Cancelalos desde Comandos, o todos juntos desconectando el sistema.</li>`:''}${ot.length?`<li>Hay ${ot.length} orden(es) de mantenimiento a realizar (${ot.map(o=>o.id).join(', ')}). Concretalas o cancelalas.</li>`:''}</ul></div></div>`+acts(0)

 else if(k==='baj'){const h=gh(id),p=DB.comandos.filter(c=>c.act===id&&c.estado==='pendiente'),ot=DB.ordenes.filter(o=>o.act===id&&o.estado==='abierta'),rg=DB.reglas.filter(r=>(r.sensor===id||r.act===id)&&r.estado==='activa');
  b=`<h3>Dar de baja ${hwLbl(h)}</h3>`+(p.length||ot.length||rg.length?`<div class="alert alert-danger">${ic('alert')}<div>No se puede dar de baja todavía:<ul>${p.length?`<li>Tiene el comando pendiente ${p[0].id}: esperá su resultado o cancelalo.</li>`:''}${ot.length?`<li>Está en la orden de mantenimiento ${ot[0].id}: concretala o cancelala.</li>`:''}${rg.length?`<li>La usan las reglas activas ${rg.map(r=>r.id).join(', ')}: dalas de baja primero.</li>`:''}</ul></div></div>`+acts(0):`<p>El equipo deja de operar y su historial se conserva. Su identificador <b>${esc(h.ident)}</b> queda libre para registrar un equipo de reemplazo.</p>`+(h.tipo==='actuador'?`<div class="alert alert-warn" style="margin-bottom:10px">${ic('alert')}<div>Último estado informado por el nodo: <b>${h.est?esc(h.est.txt.toLowerCase())+'</b> desde las '+h.est.at:'desconocido</b>'}. Después de la baja, InfoPonia no podrá enviarle comandos: si tiene que quedar apagado o cerrado, llevalo a ese estado antes.</div></div>`:'')+`<p class="sm muted">Si el aparato sigue conectado y el nodo sigue enviando su identificador, sus mensajes se rechazan y aparece la alerta «Dispositivo no registrado» indicando que era de este equipo.</p>`+acts(1,'Dar de baja',1))}
 else if(k==='rebaja'){const h=gh(id),dup=DB.hw.find(x=>x.id!==id&&x.inv===h.inv&&x.estado!=='baja'&&x.ident.toLowerCase()===h.ident.toLowerCase());

 else if(k==='react'){const o=DB.ordenes.find(o=>o.act===id&&o.estado==='abierta');b=`<h3>Volver a activar ${hwLbl(gh(id))}</h3><p>El equipo vuelve a estar activo y puede recibir comandos. Su alerta de falla se resuelve.</p>${o?`<div class="alert alert-warn">${ic('alert')}<div>Está en la orden de mantenimiento <b>${o.id}</b>, que se cancelará y se le notificará al Técnico.</div></div>`:''}`+acts(1,'Volver a activar')}
 else if(k==='ccan')b=`<h3>Cancelar ${id}</h3><p>El comando no se enviará al nodo. Esta acción no se puede deshacer.</p>`+acts(1,'Cancelar comando',1);
 else if(k==='rbaj')b=`<h3>Dar de baja ${id}</h3><p>La regla deja de evaluarse. Su historial se conserva.</p>`+acts(1,'Dar de baja',1);
 else if(k==='tbaj'){const n=DB.hw.filter(h=>h.tipoAct===id&&h.estado!=='baja').length;b=`<h3>Dar de baja ${DB.tipos.find(t=>t.id===id).n}</h3>`+(n?`<div class="alert alert-danger">${ic('alert')}<div>Hay ${n} equipo(s) de este tipo. Dalos de baja antes de eliminar el tipo.</div></div>`+acts(0):`<p>El tipo deja de estar disponible para nuevos equipos.</p>`+acts(1,'Dar de baja',1))}
 return `<div class="ov" data-ov="1"><div class="modal" role="dialog" aria-modal="true">${b}</div></div>`;
}

function newTok(){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';let t='ipn_';for(let i=0;i<40;i++)t+=c[Math.floor(Math.random()*c.length)];return t}
function failCmd(c){const h=gh(c.act);c.estado='fallido';h.estado='fuera de servicio';
 DB.alertas.push({id:nid('al','A-',3),inv:c.inv,sev:'alta',tipo:'Comando fallido',det:`${hwLbl(h)} · ${c.id}`,auto:'Se resuelve sola cuando el actuador vuelve a estar activo.',mail:true});
 const tec=INVS[c.inv].tec,ab=DB.ordenes.find(o=>o.act===h.id&&o.estado==='abierta');
 if(tec&&!ab){const id=nid('ot','OT-',4);DB.ordenes.push({id,act:h.id,estado:'abierta'});c.nota=`Se agotaron los ${maxInt()} intentos. Actuador fuera de servicio, alerta emitida y notificada por correo, y orden ${id} (prioridad alta) asignada a ${tec}.`}
 else c.nota=`Se agotaron los ${maxInt()} intentos. Actuador fuera de servicio y alerta emitida y notificada por correo. ${tec?'Ya tenía una orden de mantenimiento abierta.':'No se creó orden: el invernadero no tiene Técnico.'}`;
 toast(`${c.id} falló tras ${maxInt()} intentos. Actuador fuera de servicio.`,'danger')}
const num=x=>{x=String(x).trim().replace(',','.');return x!==''&&!isNaN(x)?Number(x):NaN};
function act(a,arg){
 const m=S.modal;
 switch(a){
 case 'nav':go(arg);if(arg==='config')S.draft=Object.fromEntries(Object.entries(DB.cfg).map(([k,v])=>[k,String(v)]));render();break;
 case 'menu':{if(S.menu===arg){S.menu=null}else{const bt=document.querySelector(`[data-act=menu][data-arg="${arg}"]`).getBoundingClientRect();S.menu=arg;S.menuPos=(bt.bottom>innerHeight-170)?{up:1,b:Math.round(innerHeight-bt.top+4),r:Math.round(innerWidth-bt.right)}:{t:Math.round(bt.bottom+4),r:Math.round(innerWidth-bt.right)}}render();break}
 case 'refresh':DB.hw.forEach(h=>{if(h.tipo==='sensor'&&!VARS[h.var].bin&&h.v!=null&&h.st==='ok'&&h.var!=='luz')h.v=Math.round((h.v+(Math.random()-.5)*.6)*10)/10});toast('Datos actualizados.','info');render();break;
 case 'refresh-quiet':DB.hw.forEach(h=>{if(h.tipo==='sensor'&&!VARS[h.var].bin&&h.v!=null&&h.st==='ok'&&h.var!=='luz'&&!(sys()&&sys().conn==='sin señal'))h.v=Math.round((h.v+(Math.random()-.5)*.4)*10)/10});render();break;
 case 'close':S.modal=null;render();break;

 case 'm-ok':{const [k,id]=m.t.split(':');S.modal=null;

  else if(k==='baj'){const h=gh(id);h.estado='baja';h.fbaja='19/11/2026';DB.alertas=DB.alertas.filter(a=>a.hw!==h.id&&!(a.det||'').includes(h.ident+' ')&&!(a.det||'').endsWith(h.ident));toast(`${hwLbl(h)} dado de baja. Su identificador queda libre.`);S.v=null}
  else if(k==='rebaja'){const h=gh(id);h.estado='activo';delete h.fbaja;const na=DB.alertas.length;DB.alertas=DB.alertas.filter(a=>!(a.ident&&a.inv===h.inv&&a.ident.toLowerCase()===h.ident.toLowerCase()));const res=na!==DB.alertas.length;recompat(h);
   if(S.screen==='hardware'&&S.v&&S.v.n==='hw-form')S.v=null;toast(hwLbl(h)+' reactivado con su historial.'+(res?' Se resolvió la alerta «Dispositivo no registrado».':'')+(h.compat==='incompatible'?' Quedó con configuración incompatible.':''),h.compat==='incompatible'?'warn':'ok')}

 case 'cmdf-clear':S.cmdF={estado:'todos',act:'todos',origen:'todos'};render();break;

 case 'hw-mod':{const h=gh(arg);S.v={n:'hw-form',id:arg};S.draft={hident:h.ident,hserial:h.serial||'',hmod:h.modelo,hcmin:h.cal?String(h.cal[0]):'',hcmax:h.cal?String(h.cal[1]):'',hsector:h.sector||'',htac:h.tipoAct||''};S.err={};render();break}
